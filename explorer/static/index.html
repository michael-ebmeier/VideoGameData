<!doctype html>
<html lang="en">
<head>

<style>
  :root {
    color-scheme: dark;
    --bg: #14171c;
    --surface: #1c2128;
    --surface-2: #242b34;
    --line: #2c343e;
    --text: #e8eaed;
    --text-2: #b4bcc6;
    --muted: #8b95a1;
    --accent: #3987e5;      /* single data series colour (dark step) */
    --accent-ink: #ffffff;
    --star: #f2b705;
    --radius: 8px;
    /* counts ramp, low to high: indigo -> blue -> teal -> green -> yellow. Dark mode: MORE is brighter. */
    --seq-1: #27307f; --seq-2: #2a539f; --seq-3: #2a7aae; --seq-4: #2fa3a6; --seq-5: #73c2a6; --seq-6: #b3dcab; --seq-7: #f7f0b8;
    /* diverging pair for correlations: red (negative) <-> neutral <-> blue (positive), four equal steps per arm */
    --div-neg-4: #e66767; --div-neg-3: #b85d5a; --div-neg-2: #8c524e; --div-neg-1: #624541; --div-0: #383835;
    --div-pos-1: #3c4c5e; --div-pos-2: #3e6089; --div-pos-3: #3d73b6; --div-pos-4: #3987e5;
    /* up to four categorical line colours (dark steps) */
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #eceef1;
      --line: #dfe3e8;
      --text: #14171c;
      --text-2: #3f4852;
      --muted: #5b6670;
      --accent: #2a78d6;    /* single data series colour (light step) */
      --seq-1: #f7f0b8; --seq-2: #b3dcab; --seq-3: #73c2a6; --seq-4: #2fa3a6; --seq-5: #2a7aae; --seq-6: #2a539f; --seq-7: #27307f;
      --div-neg-4: #e34948; --div-neg-3: #ec7971; --div-neg-2: #f1a299; --div-neg-1: #f3c9c2; --div-0: #f0efec;
      --div-pos-1: #c0d2e9; --div-pos-2: #90b5e4; --div-pos-3: #6097de; --div-pos-4: #2a78d6;
      --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }      /* the hidden attribute must win over any display rule */
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button, select, input { font: inherit; color: inherit; }

  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 1200px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .brand { font-weight: 700; letter-spacing: .2px; }
  .brand span { color: var(--accent); }
  nav { display: flex; gap: 16px; }
  nav a { color: var(--text-2); padding: 4px 0; border-bottom: 2px solid transparent; }
  nav a.on, nav a:hover { color: var(--text); border-bottom-color: var(--accent); }
  .search { margin-left: auto; flex: 1 1 220px; max-width: 360px; }
  .search input {
    width: 100%; padding: 8px 12px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line); outline: none;
  }
  .search input:focus { border-color: var(--accent); }

  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 4px; line-height: 1.2; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); }
  .error { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
           padding: 16px; }
  .error code { color: var(--text-2); }

  /* filters */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .filters select, .filters input {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; min-width: 120px; color: var(--text);
  }
  .filters input[type=number] { min-width: 0; width: 84px; }
  .filters button {
    background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
    color: var(--text-2);
  }
  .filters button:hover { border-color: var(--accent); color: var(--text); }
  .count { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

  /* cover grid */
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); transition: opacity .15s; }
  .grid.loading { opacity: .45; }
  .card { position: relative; display: block; border-radius: var(--radius); overflow: hidden;
          background: var(--surface); aspect-ratio: 3 / 4; outline: none; }
  .card:hover, .card:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .cover { position: absolute; inset: 0; background: var(--surface-2); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 12px; font-weight: 600; font-size: 14px; color: var(--text-2);
    background: linear-gradient(160deg, hsl(var(--h) 25% 24%), hsl(var(--h) 30% 14%));
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .ph { background: linear-gradient(160deg, hsl(var(--h) 35% 82%), hsl(var(--h) 30% 70%)); color: #20262d; }
  }
  .overlay {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 10px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #fff;
    opacity: 0; transition: opacity .12s;
  }
  .card:hover .overlay, .card:focus-visible .overlay { opacity: 1; }
  .overlay b { display: block; font-size: 13px; line-height: 1.25; }
  .overlay small { opacity: .8; }
  .badge {
    position: absolute; top: 6px; right: 6px; padding: 1px 7px; border-radius: 999px; font-size: 12px;
    background: rgba(0,0,0,.72); color: #fff; font-variant-numeric: tabular-nums;
  }
  .badge::before { content: "★ "; color: var(--star); }

  .pager { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 22px; }
  .pager button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer;
  }
  .pager button:disabled { opacity: .4; cursor: default; }

  /* game page */
  .game { display: grid; gap: 28px; grid-template-columns: 264px 1fr; align-items: start; }
  .game .cover-lg { position: relative; aspect-ratio: 264 / 374; border-radius: var(--radius); overflow: hidden; }
  .byline { color: var(--text-2); margin: 2px 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip {
    padding: 2px 10px; border-radius: 999px; font-size: 13px; background: var(--surface);
    border: 1px solid var(--line); color: var(--text-2);
  }
  a.chip:hover { border-color: var(--accent); color: var(--text); }
  .rating { display: flex; align-items: baseline; gap: 12px; margin: 14px 0; }
  .rating .num { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stars {
    font-size: 24px; letter-spacing: 2px; line-height: 1;
    background: linear-gradient(90deg, var(--star) var(--p), var(--surface-2) var(--p));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  button.share { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 13px; color: var(--text-2); cursor: pointer; margin-left: 8px; }
  button.share:hover { border-color: var(--accent); color: var(--text); }
  .ttb { margin: 14px 0; }
  .ttb-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .ttb-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; min-width: 110px; }
  .ttb-item .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ttb-item .k { color: var(--muted); font-size: 12px; }
  .ttb-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  .summary { max-width: 70ch; color: var(--text-2); white-space: pre-line; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 16px 0; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; }
  .shots { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .shots img { height: 150px; border-radius: 6px; flex: none; background: var(--surface); }
  section.block { margin-top: 30px; }
  section.block > h2 { margin-bottom: 10px; }

  /* stats */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 12px 0 22px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .tile .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .charts { display: grid; gap: 16px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 10px; min-width: 0; }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .chart-head button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; text-decoration: underline; }
  .chart-sub { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .chart { overflow-x: auto; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .grid-line { stroke: var(--line); stroke-width: 1; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart text.strong { fill: var(--text); }
  .chart .mark { fill: var(--accent); transition: opacity .1s; }
  .chart .band:hover .mark, .chart .band:focus .mark { opacity: .72; }
  .chart .band { outline: none; }
  .chart .band:focus-visible .hit { stroke: var(--accent); stroke-width: 1; fill: none; }
  .chart .hit { fill: transparent; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data td, table.data th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
  table.data td:last-child, table.data th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { max-height: 280px; overflow: auto; }
  .wild { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); cursor: pointer;
          border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .wild.on { border-color: var(--accent); color: var(--text); }
  .wild input { accent-color: var(--accent); }
  .scope-note { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .scope-note.wildnote { color: var(--text-2); }
  button.linklike { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
  dialog { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); max-width: 460px; padding: 18px 20px; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog h2 { margin: 0 0 8px; }
  dialog p { margin: 0 0 16px; color: var(--text-2); }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 10px; }
  dialog button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  dialog button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .section-title { font-size: 20px; margin: 36px 0 4px; }
  .rel-charts { grid-template-columns: 1fr; margin-top: 14px; }
  .chart .dot { fill: var(--accent); fill-opacity: .85; stroke: var(--surface); stroke-width: 2; }
  .chart .dot.hl { fill: none; stroke: var(--text); stroke-width: 2; pointer-events: none; }
  .chart .trend { stroke: var(--text-2); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .chart .ref { stroke: var(--text-2); stroke-width: 1.5; pointer-events: none; }
  .chart text.axis-title { fill: var(--text-2); font-size: 12px; }
  .chart text.cell-text { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; pointer-events: none; }
  .chart .band .cell { transition: opacity .1s; }
  .chart .band:hover .cell, .chart .band:focus .cell { opacity: .8; }
  .chart .band.click { cursor: pointer; }
  .seg-row { display: flex; margin: 8px 0 2px; }
  .seg { background: none; border: 1px solid var(--line); padding: 4px 12px; color: var(--text-2); cursor: pointer; }
  .seg:first-child { border-radius: 6px 0 0 6px; } .seg:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg.on { background: var(--surface-2); color: var(--text); border-color: var(--accent); position: relative; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  button.chip { font: inherit; font-size: 13px; cursor: pointer; }
  button.chip:hover { border-color: var(--accent); color: var(--text); }
  .rel-controls { margin-bottom: 6px; }
  .trim-switch { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 0; font-size: 13px; cursor: pointer; }
  .trim-switch input { accent-color: var(--accent); }
  .rel-note { max-width: 90ch; }
  .legend { display: flex; flex-wrap: wrap; gap: 3px; margin: 10px 0 2px; font-size: 11px; color: var(--muted); }
  .legend .lg { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 46px; }
  .legend i { display: block; width: 100%; height: 10px; border-radius: 2px; }
  /* pivot bar */
  .pivot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 10px 0 18px; }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 0; }
  .pv-label { width: 72px; color: var(--muted); font-size: 13px; }
  .pv-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pv-years { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .pv-years input { width: 76px; padding: 3px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .pv-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-size: 13px; color: var(--text-2); }
  .chip.on { border-color: var(--accent); color: var(--text); background: var(--surface-2); }
  .chip .x { background: none; border: none; cursor: pointer; padding: 0 0 0 6px; color: var(--muted); }
  .chip .x:hover { color: var(--text); }
  .pop-wrap { position: relative; }
  .pop { position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: min(340px, calc(100vw - 32px)); background: var(--surface-2); border: 1px solid var(--line);
         border-radius: var(--radius); padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .pop > input[type=search] { width: 100%; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .pop-sorts, .pop-groups, .pop-foot { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .pop-sorts .on { color: var(--text); text-decoration: none; font-weight: 600; }
  .pop-list { max-height: 260px; overflow: auto; margin-top: 8px; }
  .pop-item { display: flex; gap: 8px; align-items: center; padding: 3px 2px; cursor: pointer; font-size: 14px; }
  .pop-item .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pop-item input { accent-color: var(--accent); }
  .tip-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .tip-row i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .tip-row b { display: inline; margin-left: auto; padding-left: 12px; font-size: 13px; }
  .chart .trend-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .trend-pt { stroke: var(--surface); stroke-width: 2; }
  .legend.chart-legend { flex-direction: row; gap: 14px; }
  .legend .lg.inline { flex-direction: row; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--text-2); }
  .legend .lg.inline i.line { width: 16px; height: 3px; }
  .tip {
    position: fixed; z-index: 50; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.3); display: none;
  }
  .tip b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .tip span { color: var(--text-2); }

  footer.foot { max-width: 1200px; margin: 0 auto; padding: 0 16px 28px; color: var(--muted); font-size: 12px; }
  footer.foot a { text-decoration: underline; }
  @media (max-width: 720px) {
    .game { grid-template-columns: 1fr; }
    .game .cover-lg { max-width: 220px; }
    .charts { grid-template-columns: 1fr; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="./">VideoGame<span>Data</span></a>
    <nav>
      <a href="./" id="nav-browse">Browse</a>
      <a href="stats" id="nav-stats">Stats</a>
    </nav>
    <form class="search" id="search" role="search">
      <input id="q" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
    </form>
    <label class="wild" id="wild-wrap" hidden title="Off: only games with an ESRB rating. On: every game in the database.">
      <input type="checkbox" id="wild"><span>Wild west</span>
    </label>
  </div>
</header>
<dialog id="wild-dialog" aria-labelledby="wild-title">
  <h2 id="wild-title">Turn on Wild west?</h2>
  <p>This shows every game in the database, not just those with an ESRB rating: unrated shovelware, adult titles and anything
     else IGDB lists. The Stats page and its charts will include them too.</p>
  <form method="dialog" class="buttons">
    <button value="cancel">Cancel</button>
    <button value="ok" class="primary" id="wild-ok">Show everything</button>
  </form>
</dialog>
<main id="app"></main>
<footer class="foot">Game data from <a href="https://www.igdb.com" target="_blank" rel="noopener noreferrer">IGDB.com</a>.</footer>
<div class="tip" id="tip" role="status"></div>

<script>
"use strict";

/* ---------- tiny DOM helpers (all data goes in via textContent) ---------- */
const NS = "http://www.w3.org/2000/svg";
function h(tag, props, ...kids) { return build(document.createElement(tag), props, kids); }
function s(tag, props, ...kids) { return build(document.createElementNS(NS, tag), props, kids); }
function build(el, props, kids) {
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.setAttribute("class", v);
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const app = document.getElementById("app");
const fmt = n => (n == null ? "–" : Number(n).toLocaleString());

async function api(path, params) {
  // every call carries the current scope (games with an ESRB rating by default, or everything)
  if (path !== "api/columns") params = { ...(params || {}), scope: scopeParam() };
  // The static build adds static-api.js, which answers these calls in the browser (no server).
  if (window.IGDB_STATIC) return window.IGDB_STATIC.api(path, params || {});
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(params || {})) if (v !== "" && v != null) qs.set(k, v);
  const res = await fetch(path + (qs.size ? "?" + qs : ""));
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

/* ---------- scope: games with an ESRB rating by default; "wild west" is the opt-in for everything ---------- */
let wild = false;
try { wild = localStorage.getItem("igdbWildWest") === "1"; } catch (e) { /* storage can be unavailable */ }
const scopeParam = () => (wild ? "all" : "rated");
const scopeAvailable = () => !!(facets.scope && facets.scope.available);
const scoped = () => scopeAvailable() && !wild;            // true when lists should be limited to ESRB-rated games

async function setWild(on) {
  wild = on;
  try { localStorage.setItem("igdbWildWest", on ? "1" : "0"); } catch (e) { /* not remembered; still works */ }
  try { facets = await api("api/facets"); } catch (e) { /* the page will show the error */ }

const tip = document.getElementById("tip");
function showTip(e, value, label) {
  tip.replaceChildren(h("b", { text: value }), h("span", { text: label }));
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();

function hideTip() { tip.style.display = "none"; }
function tipAtElement(el, value, label) {

  showTip({ clientX: r.left + r.width / 2, clientY: r.top }, value, label);

const nOf = r => (r.n != null ? ` · ${fmt(r.n)} games` : "");   // sample size, for rows that carry one

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
const axisFmt = n => n >= 10000 ? (n / 1000) + "K" : n.toLocaleString();
const roundTop = (x, y, w, hgt, r) => {          // 4px rounded data end (top), square baseline
  r = Math.min(r, w / 2, hgt);
  return `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt}Z`;
};
const roundRight = (x, y, w, hgt, r) => {        // 4px rounded data end (right), square baseline
  r = Math.min(r, hgt / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt - r}Q${x + w},${y + hgt} ${x + w - r},${y + hgt}H${x}Z`;
};

/* Columns (vertical) or bars (horizontal), one series, drawn at the container's real width. */
function drawChart(host, rows, opts) {
  const { horizontal = false, unit = "games", labelOf = r => String(r.label) } = opts;
  const W = Math.max(280, host.clientWidth), ink = "var(--muted)";
  const max = Math.max(1, ...rows.map(r => r.value), opts.reference ? opts.reference.value : 0);
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  let svg;

  if (!horizontal) {
    const m = { l: 44, r: 8, t: 14, b: 24 }, H = 230;
    const iw = W - m.l - m.r, ih = H - m.t - m.b, band = iw / rows.length, bw = Math.max(2, Math.min(24, band - 2));
    const y = v => m.t + ih - (v / top) * ih;
    svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
    for (let v = 0; v <= top; v += step) {
      svg.append(s("line", { class: "grid-line", x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }));
      svg.append(s("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end", text: axisFmt(v) }));
    }
    const every = Math.ceil((opts.labelGap || 46) / band);
    let maxIdx = 0; rows.forEach((r, i) => { if (r.value > rows[maxIdx].value) maxIdx = i; });
    rows.forEach((r, i) => {
      const cx = m.l + band * i + band / 2, bh = (r.value / top) * ih;
      const g = s("g", { class: "band", tabindex: 0, "aria-label": `${labelOf(r)}: ${fmt(r.value)} ${unit}` });
      g.append(s("path", { class: "mark", d: roundTop(cx - bw / 2, y(r.value), bw, bh, 4) }));
      g.append(s("rect", { class: "hit", x: cx - band / 2, y: m.t, width: band, height: ih }));
      g.addEventListener("pointermove", e => showTip(e, fmt(r.value), `${labelOf(r)} · ${unit}${nOf(r)}`));
      g.addEventListener("pointerleave", hideTip);
      g.addEventListener("focus", () => tipAtElement(g, fmt(r.value), `${labelOf(r)} · ${unit}${nOf(r)}`));
      g.addEventListener("blur", hideTip);
      svg.append(g);
      if (i % every === 0 || i === rows.length - 1 && every === 1)
        svg.append(s("text", { x: cx, y: H - 6, "text-anchor": "middle", text: labelOf(r) }));
      if (i === maxIdx)   // one direct label: the peak
        svg.append(s("text", { class: "strong", x: Math.min(Math.max(cx, m.l + 14), W - m.r - 14), y: y(r.value) - 5, "text-anchor": "middle", text: fmt(r.value) }));
    });
  } else {
    const lw = Math.min(170, W * 0.38), rowH = 28, m = { t: 4, r: 56 }, H = rows.length * rowH + m.t + (opts.reference ? 22 : 0), bh = 14;
    const iw = W - lw - m.r;
    svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
    rows.forEach((r, i) => {
      const yy = m.t + i * rowH, w = Math.max(2, (r.value / max) * iw);
      const g = s("g", { class: "band", tabindex: 0, "aria-label": `${r.label}: ${fmt(r.value)} ${unit}` });
      const name = r.label.length > 26 ? r.label.slice(0, 25) + "…" : r.label;
      g.append(s("text", { x: lw - 8, y: yy + rowH / 2 + 4, "text-anchor": "end", text: name }));
      g.append(s("path", { class: "mark", d: roundRight(lw, yy + (rowH - bh) / 2, w, bh, 4) }));
      g.append(s("text", { class: "strong", x: lw + w + 6, y: yy + rowH / 2 + 4, text: fmt(r.value) }));
      g.append(s("rect", { class: "hit", x: 0, y: yy, width: W, height: rowH }));
      g.addEventListener("pointermove", e => showTip(e, fmt(r.value), `${r.label} · ${unit}${nOf(r)}`));
      g.addEventListener("pointerleave", hideTip);
      g.addEventListener("focus", () => tipAtElement(g, fmt(r.value), `${r.label} · ${unit}${nOf(r)}`));
      g.addEventListener("blur", hideTip);
      svg.append(g);
    });
    if (opts.reference) {                       // a hairline marking the overall value, labelled underneath
      const x = lw + (opts.reference.value / max) * iw, bottom = rows.length * rowH + m.t;
      svg.append(s("line", { class: "ref", x1: x, x2: x, y1: m.t, y2: bottom }));
      svg.append(s("text", { class: "strong", x: Math.min(Math.max(x, lw + 60), W - 70), y: bottom + 15, "text-anchor": "middle", text: opts.reference.label }));
    }
  }
  host.replaceChildren(svg);
}

/* Horizontal bars of each category's difference from the all-games value: blue above it, red below. */

/* Scatter of a sample of games, the fitted trend line, and nearest-point hover (click opens the game). */
function drawScatter(host, res, G) {

  const px0 = (res.x1 - res.x0) * 0.03 || 1, py0 = (res.y1 - res.y0) * 0.03 || 1;
  const x0 = res.x0 - px0, x1 = res.x1 + px0, y0 = res.y0 - py0, y1 = res.y1 + py0;
  const X = v => m.l + ((v - x0) / (x1 - x0)) * iw, Y = v => m.t + ih - ((v - y0) / (y1 - y0)) * ih;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": `${AXIS_LABEL[res.xk]} against ${AXIS_LABEL[res.yk]}, ${fmt(res.n)} games` });
  for (const t of axisTicks(res.yk, y0, y1, Math.round(ih / 55))) {

    svg.append(s("text", { x: m.l - 8, y: Y(t.t) + 4, "text-anchor": "end", text: t.label }));
  }
  for (const t of axisTicks(res.xk, x0, x1, Math.round(iw / 90))) {
    svg.append(s("line", { class: "grid-line", x1: X(t.t), x2: X(t.t), y1: m.t, y2: m.t + ih }));
    svg.append(s("text", { x: X(t.t), y: m.t + ih + 18, "text-anchor": "middle", text: t.label }));
  }
  svg.append(s("text", { class: "axis-title", x: m.l + iw / 2, y: H - 8, "text-anchor": "middle", text: axisName(res.xk) }));
  svg.append(s("text", { class: "axis-title", x: 14, y: m.t + ih / 2, "text-anchor": "middle", transform: `rotate(-90 14 ${m.t + ih / 2})`, text: axisName(res.yk) }));
  const clipId = "clip" + Math.random().toString(36).slice(2, 8);
  svg.append(s("clipPath", { id: clipId }, s("rect", { x: m.l, y: m.t, width: iw, height: ih })));
  const dots = s("g", {});
  for (const p of res.points) dots.append(s("circle", { class: "dot", cx: X(p.x), cy: Y(p.y), r: 4 }));

  const maxV = Math.max(1, ...c.series.flatMap(s => s.values.filter(v => v != null)));
  const step = niceStep(maxV / 4), top = Math.ceil(maxV / step) * step;
  const X = j => m.l + (n === 1 ? iw / 2 : (j / (n - 1)) * iw), Y = v => m.t + ih - (v / top) * ih;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": c.aria });
  for (let v = 0; v <= top + 1e-9; v += step) {
    svg.append(s("line", { class: "grid-line", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }));
    svg.append(s("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end", text: `${Math.round(v * 10) / 10}%` }));
  }
  const every = Math.ceil(46 / Math.max(1, iw / Math.max(1, n - 1)));
  c.labels.forEach((l, j) => {
    if (j % every && j !== n - 1) return;
    const x = X(j), y = m.t + ih + 16;
    svg.append(rotate ? s("text", { x, y, transform: `rotate(-38 ${x} ${y})`, "text-anchor": "end", text: l.length > 22 ? l.slice(0, 21) + "…" : l })
                      : s("text", { x, y: y + 2, "text-anchor": "middle", text: l }));
  });
  const cross = s("line", { class: "grid-line", x1: 0, x2: 0, y1: m.t, y2: m.t + ih, style: "display:none;stroke:var(--text-2)" });
  svg.append(cross);
  const ends = [];
  for (const sr of c.series) {
    let d = "";
    sr.values.forEach((v, j) => { if (v == null) return; d += (sr.values[j - 1] == null || j === 0 ? "M" : "L") + `${X(j)},${Y(v)}`; });
    svg.append(s("path", { class: "trend-line", d, style: `stroke:var(${sr.color})` }));
    sr.values.forEach((v, j) => { if (v != null) svg.append(s("circle", { class: "trend-pt", cx: X(j), cy: Y(v), r: 4, style: `fill:var(${sr.color})` })); });
    const last = sr.values.map((v, j) => (v == null ? -1 : j)).filter(j => j >= 0).pop();
    if (last !== undefined) ends.push({ sr, x: X(last), y: Y(sr.values[last]), v: sr.values[last] });
  }
  ends.sort((a, b) => a.y - b.y);                     // spread the end labels apart so they never overlap
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
  for (const e of ends) svg.append(s("text", { class: "strong", x: e.x + 10, y: e.y + 4, text: `${e.sr.name.length > 16 ? e.sr.name.slice(0, 15) + "…" : e.sr.name} ${fmtPct(e.v)}` }));
  const band = n > 1 ? iw / (n - 1) : iw;
  c.labels.forEach((l, j) => {
    const hit = s("rect", { class: "hit", x: X(j) - band / 2, y: m.t, width: band, height: ih, tabindex: 0, "aria-label": `${l}: ${c.series.map(sr => `${sr.name} ${sr.values[j] == null ? "no data" : fmtPct(sr.values[j])}`).join(", ")}` });
    const show = e => { cross.setAttribute("x1", X(j)); cross.setAttribute("x2", X(j)); cross.style.display = ""; showMultiTip(e, l, c.series.map(sr => ({ name: sr.name, color: sr.color, value: sr.values[j] == null ? "–" : fmtPct(sr.values[j]) }))); };
    hit.addEventListener("pointermove", show);
    hit.addEventListener("focus", () => { const r = hit.getBoundingClientRect(); show({ clientX: r.left + r.width / 2, clientY: r.top + 40 }); });
    const off = () => { cross.style.display = "none"; hideTip(); };
    hit.addEventListener("pointerleave", off); hit.addEventListener("blur", off);
    svg.append(hit);
  });
  host.replaceChildren(svg);
}

function compareSection(G, opts) {
  const A = IGDB_ANALYSIS, c = statsState.cmp, sl = statsState.slice;
  const mkSel = (key, options, onSet) => { const el = h("select", { onchange: e => { const v = e.target.value; c[key] = key === "bin" ? +v : v; writeStatsUrl(); rebuild(); } },
    options.map(([v, t]) => h("option", { value: v, text: t }))); el.value = String(c[key]); return el; };
  const seg = [["era", "Across eras"], ["platform", "Across platforms"]].map(([k, t]) => h("button", { type: "button", class: "seg" + (c.across === k ? " on" : ""), text: t, onclick: () => { c.across = k; writeStatsUrl(); rebuild(); } }));
  const binSel = mkSel("bin", [[10, "Decades"], [5, "5-year eras"]]), orderSel = mkSel("order", [["age", "Oldest to newest"], ["size", "Largest first"]]);
  const sortSel = mkSel("sort", [["share", "Biggest share"], ["rise", "Biggest rise"], ["fall", "Biggest fall"]]), showSel = mkSel("show", [["pct", "Share of games"], ["count", "Number of games"]]);
  const binL = h("label", { text: "Era size" }, binSel), orderL = h("label", { text: "Platform order" }, orderSel);
  const controls = h("div", { class: "filters rel-controls" }, h("div", { class: "seg-row" }, seg), binL, orderL, h("label", { text: "Sort genres by" }, sortSel), h("label", { text: "Show" }, showSel));
  const note = h("p", { class: "chart-sub rel-note" });
  const legendBox = h("div", {});
  let res;

  const specFor = () => {
    const nC = res.cols.length, pct = c.show !== "count", era = res.across === "era";
    const noun = era ? "era" : "platform";
    const maxCount = Math.max(1, ...res.rows.flatMap(r => r.counts));
    const lab = j => res.cols[j].label;
    const cell = (i, j) => {
      const r = res.rows[i];
      if (j === nC) {
        if (r.change == null) return { fill: "--surface-2", text: "–", muted: true, tip: ["No change figure", `needs two ${noun}s with ${res.minGames}+ games`] };
        return { fill: chgVar(r.change), text: pts(r.change), aria: `${r.name} change ${pts(r.change)} points`,
                 tip: [`${pts(r.change)} points`, `${r.name}: ${fmtPct(r.shares[res.first])} in ${lab(res.first)} → ${fmtPct(r.shares[res.last])} in ${lab(res.last)}`] };
      }
      const sh = r.shares[j], n = res.cols[j].n;
      if (sh == null) return { fill: "--surface-2", text: "–", muted: true, tip: ["Too few games", `${lab(j)} has only ${fmt(n)} games in this slice (needs ${res.minGames}+)`] };
      return pct
        ? { fill: liftVar(r.overall > 0 ? sh / r.overall : null), text: fmtPct(sh), aria: `${r.name}, ${lab(j)}: ${fmtPct(sh)}`,
            tip: [fmtPct(sh), `${r.name} is ${fmtPct(sh)} of ${lab(j)} games (${fmt(r.counts[j])} of ${fmt(n)}), versus ${fmtPct(r.overall)} across all ${noun}s`] }
        : { fill: seqVar(r.counts[j], maxCount), text: cellCount(r.counts[j]), aria: `${r.name}, ${lab(j)}: ${fmt(r.counts[j])} games`,
            tip: [fmt(r.counts[j]), `${r.name} games in ${lab(j)} (${fmtPct(sh)} of ${fmt(n)})`] };
    };
    const footers = [{ label: "Games in column", cell: j => (j < nC ? { fill: "--surface-2", text: cellCount(res.cols[j].n), tip: [fmt(res.cols[j].n), `games in ${lab(j)}`] } : null) }];
    if (!era) footers.push({ label: "Median release year", cell: j => (j < nC ? { fill: "--surface-2", text: String(res.cols[j].age ?? "–"), tip: [String(res.cols[j].age ?? "unknown"), `median release year of ${lab(j)} games`] } : null) });
    return {
      draw: host => drawGrid(host, { rows: res.rows.map(r => r.name), cols: [...res.cols.map(x => x.label), "Change"], rotate: true, aria: `Genre share by ${noun}`,
        corner: `Genre ↓  ·  ${era ? "Era" : "Platform (old → new)"} →`, rowNotes: res.rows.map(r => `avg ${fmtPct(r.overall)}`), cell, footers }),
      table: () => h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", { text: "Genre" }), res.cols.map(x => h("th", { text: x.label })), h("th", { text: "Change (pts)" }))),
        h("tbody", {}, res.rows.map(r => h("tr", {}, h("td", { text: r.name }), r.shares.map((v, j) => h("td", { text: v == null ? "–" : `${fmtPct(v)} (${fmt(r.counts[j])})` })), h("td", { text: r.change == null ? "–" : pts(r.change) }))),
          h("tr", {}, h("td", { text: "Games in column" }), res.cols.map(x => h("td", { text: fmt(x.n) })), h("td", { text: "" })))),
    };
  };
  const heat = vizCard({ title: "Genre share, column by column", sub: "", draw: () => {}, table: () => h("div"), headExtra: h("div", {}, controls) });
  heat.insertBefore(note, heat.querySelector(".chart")); heat.append(legendBox);

  // the trend lines: which genres, defaulting to the biggest movers
  const lineChips = h("div", { class: "presets" });
  const trend = vizCard({ title: "Trend lines", sub: "Pick up to four genres to follow across the columns.", headExtra: lineChips, draw: () => {}, table: () => h("div") });
  const chosen = () => { const ids = c.lines.filter(id => res.rows.some(r => r.id === id)); if (ids.length) return ids;
    const movers = res.rows.filter(r => r.change != null && r.overall >= 3);
    const risers = movers.slice().sort((a, b) => b.change - a.change).slice(0, 2), fallers = movers.slice().sort((a, b) => a.change - b.change).slice(0, 2).filter(r => !risers.includes(r));
    const pick = [...risers, ...fallers].slice(0, 4); return (pick.length ? pick : res.rows.slice(0, 4)).map(r => r.id); };
  const drawTrend = () => {
    const ids = chosen(), rows = ids.map(id => res.rows.find(r => r.id === id)).filter(Boolean);
    lineChips.replaceChildren(...res.rows.map(r => h("button", { type: "button", class: "chip pick" + (ids.includes(r.id) ? " on" : ""), text: r.name,
      onclick: () => { let cur = chosen(); if (cur.includes(r.id)) { cur = cur.filter(x => x !== r.id); trendSlots.delete(r.id); } else if (cur.length < 4) cur = [...cur, r.id]; else return;
        c.lines = cur; writeStatsUrl(); drawTrend(); } })));
    ids.forEach(slotFor);
    const series = rows.map(r => ({ name: r.name, color: `--series-${slotFor(r.id)}`, values: r.shares }));
    trend.update({ sub: "Share of each column's games that are in the genre. Gaps are columns with too few games.",
      draw: host => drawLines(host, { labels: res.cols.map(x => x.label), series, aria: "Genre share trend" }),
      table: () => h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", { text: "" }), res.cols.map(x => h("th", { text: x.label })))),
        h("tbody", {}, rows.map(r => h("tr", {}, h("td", { text: r.name }), r.shares.map(v => h("td", { text: v == null ? "–" : fmtPct(v) })))))) });
    trend.querySelector(".chart-legend")?.remove();
    const legend = h("div", { class: "legend chart-legend" }, series.map(sr => h("span", { class: "lg inline" }, h("i", { class: "line", style: `background:var(${sr.color})` }), sr.name)));
    trend.insertBefore(legend, trend.querySelector(".chart"));
  };

  function rebuild() {
    seg.forEach((b, i) => b.classList.toggle("on", c.across === ["era", "platform"][i]));
    binL.hidden = c.across !== "era"; orderL.hidden = c.across !== "platform";
    res = A.compareShares(G, facets, { across: c.across, bin: c.bin, order: c.order, sort: c.sort, platformIds: sl.platforms, options: opts });
    if (!res.valid.length) {
      heat.update({ sub: "", draw: host => host.replaceChildren(h("p", { class: "muted", text: `No ${c.across === "era" ? "era" : "platform"} has ${res.minGames}+ games in this slice, so there is nothing to compare. Widen the slice above.` })), table: () => h("div") });
      trend.hidden = true; legendBox.replaceChildren(); note.textContent = ""; return;
    }
    trend.hidden = false;
    const era = c.across === "era", pct = c.show !== "count";
    note.textContent = (era ? "Each column is a group of release years. " : "Each column is a platform, oldest to newest by the median release year of its games. ") +
      (pct ? "Each cell is the share of the column's games that are in the genre (a game can have several genres, so a column adds up to more than 100%). Color compares it with the genre's share across all columns: blue is higher than usual there, red lower. "
           : "Each cell is the number of games in the genre. ") +
      `Change is the last column's share minus the first's, in percentage points. Columns with fewer than ${res.minGames} games show no numbers.`;
    const sp = specFor();
    heat.update({ sub: "", draw: sp.draw, table: sp.table });
    legendBox.replaceChildren(
      pct ? swatches([["--div-neg-4", "≤0.4×"], ["--div-neg-3", "0.5×"], ["--div-neg-2", "0.65×"], ["--div-neg-1", "0.8×"], ["--div-0", "usual"], ["--div-pos-1", "1.2×"], ["--div-pos-2", "1.5×"], ["--div-pos-3", "2×"], ["--div-pos-4", "2.5×+"]])
          : swatches([["--seq-1", "0"], ["--seq-2", ""], ["--seq-3", ""], ["--seq-4", ""], ["--seq-5", ""], ["--seq-6", ""], ["--seq-7", compact(Math.max(1, ...res.rows.flatMap(r => r.counts)))]]),
      h("p", { class: "chart-sub", text: pct ? "Share compared with the genre's usual share across the columns (× that average)." : "Colors run on a square-root scale, so smaller counts stay visible." }),
      swatches([["--div-neg-4", `${MINUS}10`], ["--div-neg-3", `${MINUS}6`], ["--div-neg-2", `${MINUS}3`], ["--div-neg-1", `${MINUS}1`], ["--div-0", "~0"], ["--div-pos-1", "+1"], ["--div-pos-2", "+3"], ["--div-pos-3", "+6"], ["--div-pos-4", "+10"]]),
      h("p", { class: "chart-sub", text: "Change column: how many percentage points the share moved from the first column to the last." }));
    drawTrend(); trend.redraw();
  }
  const section = h("section", { class: "rel-section" }, h("h2", { class: "section-title", text: "How the genre mix changes" }),
    h("p", { class: "muted", text: "Compare genres across release eras, or across platforms from older to newer systems. It follows the era, platform and genre choices above." }),
    h("div", { class: "charts rel-charts" }, heat, trend));
  rebuild();
  section.redraw = () => { heat.redraw(); trend.redraw(); };

}

/* ---------- relationships: correlation matrix + a comparison with changeable axes ---------- */
function relationshipsSection(state) {
  const hasTtb = !!facets.has_time_to_beat;
  const slot = h("div", { class: "rel-slot" }, h("p", { class: "muted", text: "Loading the relationship analysis…" }));
  const trimBox = h("input", { type: "checkbox", checked: state.trim, onchange: e => { state.trim = e.target.checked; keep(); load(); } });
  const section = h("section", { class: "rel-section" }, h("h2", { class: "section-title", text: "Relationships" }),
    h("p", { class: "muted", text: "How genre, rating, time to beat, release year and popularity relate to each other" + (sliceActive() ? ", within the slice chosen above." : ".") }),
    h("label", { class: "trim-switch", title: "Ignores the lowest 1% and highest 1% of time to beat and of number of ratings, so a few extreme or mistaken entries don't stretch the charts." },
      trimBox, " Trim extremes ", h("span", { class: "muted", text: "(ignore the lowest and highest 1% of time to beat and number of ratings)" })),
    slot);
  const keep = () => writeStatsUrl();
  const load = async () => {
    try {
      const G = await getColumns();
      const keys = ["rating", ...(hasTtb ? ["ttb"] : []), "year", "votes", "platforms"];
      let explorer;
      const matrix = matrixCard(G, keys, state, (a, b) => { explorer.set(a, b); explorer.scrollIntoView({ behavior: "smooth", block: "center" }); });
      explorer = explorerCard(G, state, keep);
      slot.replaceChildren(h("div", { class: "charts rel-charts" }, matrix, explorer));
      matrix.redraw(); explorer.redraw();
    } catch (e) { slot.replaceChildren(h("div", { class: "error" }, h("b", { text: "Couldn't load the relationship analysis. " }), h("code", { text: e.message }))); }
  };
  load();
  return section;
}

async function statsPage(params) {
  document.title = "Stats · VideoGameData Explorer";
  app.replaceChildren(h("h1", { text: "Stats" }), h("p", { class: "muted", text: "Loading the games…" }));
  let G;
  try { G = await getColumns(); } catch (e) { throw e; }
  readStatsState(params || new URLSearchParams());
  const A = IGDB_ANALYSIS, results = h("div", { class: "stats-results" });
  const pivot = pivotBar(G, () => renderResults());
  app.replaceChildren(h("h1", { text: "Stats" }), scopeNote(), pivot.el, results);

  const pctOf = (a, b) => b ? ` (${Math.round(100 * a / b)}%)` : "";
  const tile = (v, k) => h("div", { class: "tile" }, h("div", { class: "v", text: v }), h("div", { class: "k", text: k }));
  function renderResults() {
    const sm = A.sliceMask(G, statsState.slice, scoped());
    sliceCtx.mask = sm ? sm.mask : null; sliceCtx.key = sm ? sm.key : "";
    const opts = { scoped: scoped(), mask: sliceCtx.mask, maskKey: sliceCtx.key };
    const sum = A.summarize(G, facets, opts), t = sum.totals;
    pivot.update(t.games);
    if (!t.games) {
      results.replaceChildren(h("div", { class: "error" }, h("b", { text: "No games match this slice. " }), "Try a wider era or fewer platform or genre choices."));
      return;
    }
    const cards = [
      chartCard("Games released per year", "Release year of every game with a date, 1970 onward", sum.per_year, { axis: "Year", unit: "games" }),
      chartCard("Rating distribution", "Average user + critic score, games with at least 5 ratings", sum.ratings,
        { axis: "Score range", unit: "games", labelGap: 34, labelOf: r => `${r.label}–${r.label + 9}` }),
      chartCard("Top genres", "Games per genre (a game can have several)", sum.top_genres, { horizontal: true, axis: "Genre", unit: "games" }),
      chartCard("Top platforms", "Games per platform (a game can be on several)", sum.top_platforms, { horizontal: true, axis: "Platform", unit: "games" }),
      ...(sum.ttb_buckets.length ? [
        chartCard("How long games take to beat", "Normal playthrough, games with at least 3 player reports", sum.ttb_buckets, { axis: "Time to beat", unit: "games", labelGap: 64 }),
        ...(sum.ttb_by_genre.length ? [chartCard("Median time to beat, by genre", "Hours for a normal playthrough; genres with 30+ timed games (a game can have several genres)", sum.ttb_by_genre, { horizontal: true, axis: "Genre", unit: "median hours" })] : []),
        ...(sum.ttb_by_year.length ? [chartCard("Median time to beat, by release year", "Hours for a normal playthrough; years with 20+ timed games", sum.ttb_by_year, { axis: "Year", unit: "median hours" })] : []),
      ] : []),
    ];
    const compare = compareSection(G, opts);
    results.replaceChildren(
      h("div", { class: "tiles" },
        tile(fmt(t.games), sliceActive() ? "games in this slice" : scoped() ? "games with an ESRB rating" : "games in the dump"),
        tile(fmt(t.rated), "with a rating" + pctOf(t.rated, t.games)),
        tile(fmt(t.covered), "with cover art" + pctOf(t.covered, t.games)),
        t.timed ? tile(fmt(t.timed), "with time to beat" + pctOf(t.timed, t.games)) : null,
        tile(t.first_year != null ? `${t.first_year}–${t.last_year}` : "–", "release years covered")),
      h("div", { class: "charts" }, cards),
      compare,
      relationshipsSection(statsState.rel));
    cards.forEach(c => c.redraw()); compare.redraw();
  }
  renderResults();
}

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => document.querySelectorAll(".chart-card").forEach(c => c.redraw && c.redraw()), 120);

(async () => {
  try { facets = await api("api/facets"); } catch (e) { /* the page itself will show the error */ }
  syncWildUi();
