<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="__BASE__">
<!--ANALYSIS_JS-->
<!--STATIC_API-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoGameData Explorer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14171c;
    --surface: #1c2128;
    --surface-2: #242b34;
    --line: #2c343e;
    --text: #e8eaed;
    --text-2: #b4bcc6;
    --muted: #8b95a1;
    --accent: #3987e5;      /* single data series colour (dark step) */
    --accent-ink: #ffffff;
    --star: #f2b705;
    --radius: 8px;
    /* heatmap ramp (one hue; low to high). In dark mode it flips so that MORE is lighter. */
    --seq-1: #0d366b; --seq-2: #104281; --seq-3: #184f95; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #cde2fb;
    /* diverging pair for correlations: red (negative) <-> neutral <-> blue (positive), four equal steps per arm */
    --div-neg-4: #e66767; --div-neg-3: #b85d5a; --div-neg-2: #8c524e; --div-neg-1: #624541; --div-0: #383835;
    --div-pos-1: #3c4c5e; --div-pos-2: #3e6089; --div-pos-3: #3d73b6; --div-pos-4: #3987e5;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #eceef1;
      --line: #dfe3e8;
      --text: #14171c;
      --text-2: #3f4852;
      --muted: #5b6670;
      --accent: #2a78d6;    /* single data series colour (light step) */
      --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
      --div-neg-4: #e34948; --div-neg-3: #ec7971; --div-neg-2: #f1a299; --div-neg-1: #f3c9c2; --div-0: #f0efec;
      --div-pos-1: #c0d2e9; --div-pos-2: #90b5e4; --div-pos-3: #6097de; --div-pos-4: #2a78d6;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }      /* the hidden attribute must win over any display rule */
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button, select, input { font: inherit; color: inherit; }

  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 1200px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .brand { font-weight: 700; letter-spacing: .2px; }
  .brand span { color: var(--accent); }
  nav { display: flex; gap: 16px; }
  nav a { color: var(--text-2); padding: 4px 0; border-bottom: 2px solid transparent; }
  nav a.on, nav a:hover { color: var(--text); border-bottom-color: var(--accent); }
  .search { margin-left: auto; flex: 1 1 220px; max-width: 360px; }
  .search input {
    width: 100%; padding: 8px 12px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line); outline: none;
  }
  .search input:focus { border-color: var(--accent); }

  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 4px; line-height: 1.2; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); }
  .error { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
           padding: 16px; }
  .error code { color: var(--text-2); }

  /* filters */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .filters select, .filters input {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; min-width: 120px; color: var(--text);
  }
  .filters input[type=number] { min-width: 0; width: 84px; }
  .filters button {
    background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
    color: var(--text-2);
  }
  .filters button:hover { border-color: var(--accent); color: var(--text); }
  .count { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

  /* cover grid */
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); transition: opacity .15s; }
  .grid.loading { opacity: .45; }
  .card { position: relative; display: block; border-radius: var(--radius); overflow: hidden;
          background: var(--surface); aspect-ratio: 3 / 4; outline: none; }
  .card:hover, .card:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .cover { position: absolute; inset: 0; background: var(--surface-2); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 12px; font-weight: 600; font-size: 14px; color: var(--text-2);
    background: linear-gradient(160deg, hsl(var(--h) 25% 24%), hsl(var(--h) 30% 14%));
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .ph { background: linear-gradient(160deg, hsl(var(--h) 35% 82%), hsl(var(--h) 30% 70%)); color: #20262d; }
  }
  .overlay {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 10px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #fff;
    opacity: 0; transition: opacity .12s;
  }
  .card:hover .overlay, .card:focus-visible .overlay { opacity: 1; }
  .overlay b { display: block; font-size: 13px; line-height: 1.25; }
  .overlay small { opacity: .8; }
  .badge {
    position: absolute; top: 6px; right: 6px; padding: 1px 7px; border-radius: 999px; font-size: 12px;
    background: rgba(0,0,0,.72); color: #fff; font-variant-numeric: tabular-nums;
  }
  .badge::before { content: "★ "; color: var(--star); }

  .pager { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 22px; }
  .pager button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer;
  }
  .pager button:disabled { opacity: .4; cursor: default; }

  /* game page */
  .game { display: grid; gap: 28px; grid-template-columns: 264px 1fr; align-items: start; }
  .game .cover-lg { position: relative; aspect-ratio: 264 / 374; border-radius: var(--radius); overflow: hidden; }
  .byline { color: var(--text-2); margin: 2px 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip {
    padding: 2px 10px; border-radius: 999px; font-size: 13px; background: var(--surface);
    border: 1px solid var(--line); color: var(--text-2);
  }
  a.chip:hover { border-color: var(--accent); color: var(--text); }
  .rating { display: flex; align-items: baseline; gap: 12px; margin: 14px 0; }
  .rating .num { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stars {
    font-size: 24px; letter-spacing: 2px; line-height: 1;
    background: linear-gradient(90deg, var(--star) var(--p), var(--surface-2) var(--p));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .ttb { margin: 14px 0; }
  .ttb-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .ttb-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; min-width: 110px; }
  .ttb-item .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ttb-item .k { color: var(--muted); font-size: 12px; }
  .ttb-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  .summary { max-width: 70ch; color: var(--text-2); white-space: pre-line; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 16px 0; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; }
  .shots { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .shots img { height: 150px; border-radius: 6px; flex: none; background: var(--surface); }
  section.block { margin-top: 30px; }
  section.block > h2 { margin-bottom: 10px; }

  /* stats */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 12px 0 22px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .tile .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--muted); font-size: 13px; }
  .charts { display: grid; gap: 16px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 10px; min-width: 0; }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .chart-head button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; text-decoration: underline; }
  .chart-sub { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .grid-line { stroke: var(--line); stroke-width: 1; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart text.strong { fill: var(--text); }
  .chart .mark { fill: var(--accent); transition: opacity .1s; }
  .chart .band:hover .mark, .chart .band:focus .mark { opacity: .72; }
  .chart .band { outline: none; }
  .chart .band:focus-visible .hit { stroke: var(--accent); stroke-width: 1; fill: none; }
  .chart .hit { fill: transparent; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data td, table.data th { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
  table.data td:last-child, table.data th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { max-height: 280px; overflow: auto; }
  .wild { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); cursor: pointer;
          border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .wild.on { border-color: var(--accent); color: var(--text); }
  .wild input { accent-color: var(--accent); }
  .scope-note { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .scope-note.wildnote { color: var(--text-2); }
  button.linklike { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; }
  dialog { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); max-width: 460px; padding: 18px 20px; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog h2 { margin: 0 0 8px; }
  dialog p { margin: 0 0 16px; color: var(--text-2); }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 10px; }
  dialog button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  dialog button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .section-title { font-size: 20px; margin: 36px 0 4px; }
  .rel-charts { grid-template-columns: 1fr; margin-top: 14px; }
  .chart .dot { fill: var(--accent); fill-opacity: .85; stroke: var(--surface); stroke-width: 2; }
  .chart .dot.hl { fill: none; stroke: var(--text); stroke-width: 2; pointer-events: none; }
  .chart .trend { stroke: var(--text-2); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .chart .ref { stroke: var(--text-2); stroke-width: 1.5; pointer-events: none; }
  .chart text.axis-title { fill: var(--text-2); font-size: 12px; }
  .chart text.cell-text { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; pointer-events: none; }
  .chart .band .cell { transition: opacity .1s; }
  .chart .band:hover .cell, .chart .band:focus .cell { opacity: .8; }
  .chart .band.click { cursor: pointer; }
  .seg-row { display: flex; margin: 8px 0 2px; }
  .seg { background: none; border: 1px solid var(--line); padding: 4px 12px; color: var(--text-2); cursor: pointer; }
  .seg:first-child { border-radius: 6px 0 0 6px; } .seg:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg.on { background: var(--surface-2); color: var(--text); border-color: var(--accent); position: relative; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  button.chip { font: inherit; font-size: 13px; cursor: pointer; }
  button.chip:hover { border-color: var(--accent); color: var(--text); }
  .rel-controls { margin-bottom: 6px; }
  .trim-switch { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 0; font-size: 13px; cursor: pointer; }
  .trim-switch input { accent-color: var(--accent); }
  .rel-note { max-width: 90ch; }
  .legend { display: flex; flex-wrap: wrap; gap: 3px; margin: 10px 0 2px; font-size: 11px; color: var(--muted); }
  .legend .lg { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 46px; }
  .legend i { display: block; width: 100%; height: 10px; border-radius: 2px; }
  .tip {
    position: fixed; z-index: 50; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.3); display: none;
  }
  .tip b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .tip span { color: var(--text-2); }

  footer.foot { max-width: 1200px; margin: 0 auto; padding: 0 16px 28px; color: var(--muted); font-size: 12px; }
  footer.foot a { text-decoration: underline; }
  @media (max-width: 720px) {
    .game { grid-template-columns: 1fr; }
    .game .cover-lg { max-width: 220px; }
    .charts { grid-template-columns: 1fr; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/">VideoGame<span>Data</span></a>
    <nav>
      <a href="#/" id="nav-browse">Browse</a>
      <a href="#/stats" id="nav-stats">Stats</a>
    </nav>
    <form class="search" id="search" role="search">
      <input id="q" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
    </form>
    <label class="wild" id="wild-wrap" hidden title="Off: only games with an ESRB rating. On: every game in the database.">
      <input type="checkbox" id="wild"><span>Wild west</span>
    </label>
  </div>
</header>
<dialog id="wild-dialog" aria-labelledby="wild-title">
  <h2 id="wild-title">Turn on Wild west?</h2>
  <p>This shows every game in the database, not just those with an ESRB rating: unrated shovelware, adult titles and anything
     else IGDB lists. The Stats page and its charts will include them too.</p>
  <form method="dialog" class="buttons">
    <button value="cancel">Cancel</button>
    <button value="ok" class="primary" id="wild-ok">Show everything</button>
  </form>
</dialog>
<main id="app"></main>
<footer class="foot">Game data from <a href="https://www.igdb.com" target="_blank" rel="noopener noreferrer">IGDB.com</a>.</footer>
<div class="tip" id="tip" role="status"></div>

<script>
"use strict";

/* ---------- tiny DOM helpers (all data goes in via textContent) ---------- */
const NS = "http://www.w3.org/2000/svg";
function h(tag, props, ...kids) { return build(document.createElement(tag), props, kids); }
function s(tag, props, ...kids) { return build(document.createElementNS(NS, tag), props, kids); }
function build(el, props, kids) {
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.setAttribute("class", v);
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const app = document.getElementById("app");
const fmt = n => (n == null ? "–" : Number(n).toLocaleString());

async function api(path, params) {
  // every call carries the current scope (games with an ESRB rating by default, or everything)
  if (path !== "api/columns") params = { ...(params || {}), scope: scopeParam() };
  // The static build adds static-api.js, which answers these calls in the browser (no server).
  if (window.IGDB_STATIC) return window.IGDB_STATIC.api(path, params || {});
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(params || {})) if (v !== "" && v != null) qs.set(k, v);
  const res = await fetch(path + (qs.size ? "?" + qs : ""));
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

/* ---------- scope: games with an ESRB rating by default; "wild west" is the opt-in for everything ---------- */
let wild = false;
try { wild = localStorage.getItem("igdbWildWest") === "1"; } catch (e) { /* storage can be unavailable */ }
const scopeParam = () => (wild ? "all" : "rated");
const scopeAvailable = () => !!(facets.scope && facets.scope.available);
const scoped = () => scopeAvailable() && !wild;            // true when lists should be limited to ESRB-rated games

async function setWild(on) {
  wild = on;
  try { localStorage.setItem("igdbWildWest", on ? "1" : "0"); } catch (e) { /* not remembered; still works */ }
  try { facets = await api("api/facets"); } catch (e) { /* the page will show the error */ }
  syncWildUi();
  route();
}
function syncWildUi() {
  const wrap = document.getElementById("wild-wrap"), box = document.getElementById("wild");
  wrap.hidden = !scopeAvailable();
  box.checked = wild && scopeAvailable();
  wrap.classList.toggle("on", box.checked);
}
function askWild() {
  const dlg = document.getElementById("wild-dialog");
  if (dlg.showModal) dlg.showModal(); else if (confirm("Show every game, including unrated and adult titles?")) setWild(true);
}
document.getElementById("wild").addEventListener("change", e => {
  if (e.target.checked) { e.target.checked = false; askWild(); } else setWild(false);
});
document.getElementById("wild-dialog").addEventListener("close", e => { if (e.target.returnValue === "ok") setWild(true); });

/* a one-line reminder of what the lists are showing, with the way to change it */
function scopeNote() {
  if (!scopeAvailable()) return null;
  const sc = facets.scope, flip = (label, on) => h("button", { type: "button", class: "linklike", text: label, onclick: () => (on ? askWild() : setWild(false)) });
  return wild
    ? h("p", { class: "scope-note wildnote" }, `Wild west: showing every game (${fmt(sc.all)}), including ones with no ESRB rating. `, flip("Back to rated games only", false))
    : h("p", { class: "scope-note" }, `Showing the ${fmt(sc.rated)} games with an ESRB rating (of ${fmt(sc.all)} in the database). `, flip("Turn on Wild west", true), " to include the rest.");
}

const IMG = "https://images.igdb.com/igdb/image/upload/";
function hue(str) { let x = 0; for (const c of str || "") x = (x * 31 + c.charCodeAt(0)) % 360; return x; }

/* Cover art with a coloured title placeholder underneath (shows if the image is missing/offline). */
function cover(imageId, name, size) {
  const box = h("div", { class: "cover" }, h("div", { class: "ph", style: `--h:${hue(name)}` }, name || "Unknown"));
  if (imageId) {
    const img = h("img", { src: `${IMG}${size}/${imageId}.jpg`, alt: "", loading: "lazy" });
    img.addEventListener("error", () => img.remove());
    box.append(img);
  }
  return box;
}

/* 12.5 -> "12.5 h", 0.4 -> "24 min" */
function hoursText(h) {
  if (h == null) return "";
  if (h < 1) return Math.max(1, Math.round(h * 60)) + " min";
  return (h < 10 ? String(Math.round(h * 10) / 10) : String(Math.round(h))) + " h";
}

function card(g) {
  return h("a", { class: "card", href: `#/game/${g.id}`, "aria-label": g.name },
    cover(g.cover, g.name, "t_cover_big"),
    g.rating != null && h("span", { class: "badge", text: (g.rating / 20).toFixed(1) }),
    h("div", { class: "overlay" }, h("b", { text: g.name }), h("small", { text: [g.year, g.ttb != null && hoursText(g.ttb)].filter(x => x != null && x !== false && x !== "").join(" · ") })));
}

/* ---------- state / routing ---------- */
let facets = { genres: [], platforms: [] };
const SORTS = [["popular", "Most rated"], ["rating", "Highest rated"], ["newest", "Newest"], ["oldest", "Oldest"], ["name", "A–Z"]];
const LENGTH_SORTS = [["shortest", "Shortest to beat"], ["longest", "Longest to beat"]];
const LENGTHS = [["", "Any length"], ["0-5", "Under 5 h"], ["5-10", "5–10 h"], ["10-20", "10–20 h"], ["20-40", "20–40 h"], ["40-", "40 h or more"]];

function parseHash() {
  const raw = location.hash.slice(1) || "/";
  const i = raw.indexOf("?");
  return { path: i < 0 ? raw : raw.slice(0, i), params: new URLSearchParams(i < 0 ? "" : raw.slice(i + 1)) };
}
function go(path, params) {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(params || {})) if (v !== "" && v != null) qs.set(k, v);
  location.hash = path + (qs.size ? "?" + qs : "");
}

async function route() {
  const { path, params } = parseHash();
  document.getElementById("nav-browse").classList.toggle("on", !path.startsWith("/stats"));
  document.getElementById("nav-stats").classList.toggle("on", path.startsWith("/stats"));
  document.getElementById("q").value = path === "/" ? (params.get("q") || "") : "";
  window.scrollTo(0, 0);
  try {
    if (path === "/stats") await statsPage(params);

/* Columns (vertical) or bars (horizontal), one series, drawn at the container's real width. */
function drawChart(host, rows, opts) {
  const { horizontal = false, unit = "games", labelOf = r => String(r.label) } = opts;
  const W = Math.max(280, host.clientWidth), ink = "var(--muted)";
  const max = Math.max(1, ...rows.map(r => r.value), opts.reference ? opts.reference.value : 0);
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  let svg;

  if (!horizontal) {
    const m = { l: 44, r: 8, t: 14, b: 24 }, H = 230;
    const iw = W - m.l - m.r, ih = H - m.t - m.b, band = iw / rows.length, bw = Math.max(2, Math.min(24, band - 2));
    const y = v => m.t + ih - (v / top) * ih;
    svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
    for (let v = 0; v <= top; v += step) {
      svg.append(s("line", { class: "grid-line", x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }));
      svg.append(s("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end", text: axisFmt(v) }));
    }

    rows.forEach((r, i) => {

      g.append(s("path", { class: "mark", d: roundTop(cx - bw / 2, y(r.value), bw, bh, 4) }));
      g.append(s("rect", { class: "hit", x: cx - band / 2, y: m.t, width: band, height: ih }));
      g.addEventListener("pointermove", e => showTip(e, fmt(r.value), `${labelOf(r)} · ${unit}${nOf(r)}`));
      g.addEventListener("pointerleave", hideTip);
      g.addEventListener("focus", () => tipAtElement(g, fmt(r.value), `${labelOf(r)} · ${unit}${nOf(r)}`));
      g.addEventListener("blur", hideTip);
      svg.append(g);
      if (i % every === 0 || i === rows.length - 1 && every === 1)
        svg.append(s("text", { x: cx, y: H - 6, "text-anchor": "middle", text: labelOf(r) }));
      if (i === maxIdx)   // one direct label: the peak
        svg.append(s("text", { class: "strong", x: Math.min(Math.max(cx, m.l + 14), W - m.r - 14), y: y(r.value) - 5, "text-anchor": "middle", text: fmt(r.value) }));
    });

    const iw = W - lw - m.r;
    svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
    rows.forEach((r, i) => {
      const yy = m.t + i * rowH, w = Math.max(2, (r.value / max) * iw);
      const g = s("g", { class: "band", tabindex: 0, "aria-label": `${r.label}: ${fmt(r.value)} ${unit}` });
      const name = r.label.length > 26 ? r.label.slice(0, 25) + "…" : r.label;
      g.append(s("text", { x: lw - 8, y: yy + rowH / 2 + 4, "text-anchor": "end", text: name }));
      g.append(s("path", { class: "mark", d: roundRight(lw, yy + (rowH - bh) / 2, w, bh, 4) }));
      g.append(s("text", { class: "strong", x: lw + w + 6, y: yy + rowH / 2 + 4, text: fmt(r.value) }));
      g.append(s("rect", { class: "hit", x: 0, y: yy, width: W, height: rowH }));
      g.addEventListener("pointermove", e => showTip(e, fmt(r.value), `${r.label} · ${unit}${nOf(r)}`));
      g.addEventListener("pointerleave", hideTip);
      g.addEventListener("focus", () => tipAtElement(g, fmt(r.value), `${r.label} · ${unit}${nOf(r)}`));
      g.addEventListener("blur", hideTip);
      svg.append(g);
    });
    if (opts.reference) {                       // a hairline marking the overall value, labelled underneath
      const x = lw + (opts.reference.value / max) * iw, bottom = rows.length * rowH + m.t;
      svg.append(s("line", { class: "ref", x1: x, x2: x, y1: m.t, y2: bottom }));
      svg.append(s("text", { class: "strong", x: Math.min(Math.max(x, lw + 60), W - 70), y: bottom + 15, "text-anchor": "middle", text: opts.reference.label }));
    }
  }

}

function axisTicks(key, lo, hi, room) {

const signedVal = (v, key) => (v < 0 ? MINUS : v > 0 ? "+" : "") + (key === "ttb" ? hoursText(Math.abs(v)) : String(Math.abs(Math.round(v * 10) / 10)));

/* Horizontal bars of each category's difference from the all-games value: blue above it, red below. */

/* Scatter of a sample of games, the fitted trend line, and nearest-point hover (click opens the game). */

  const px0 = (res.x1 - res.x0) * 0.03 || 1, py0 = (res.y1 - res.y0) * 0.03 || 1;

  const X = v => m.l + ((v - x0) / (x1 - x0)) * iw, Y = v => m.t + ih - ((v - y0) / (y1 - y0)) * ih;

  }
  for (const t of axisTicks(res.xk, x0, x1, Math.round(iw / 90))) {
    svg.append(s("line", { class: "grid-line", x1: X(t.t), x2: X(t.t), y1: m.t, y2: m.t + ih }));
    svg.append(s("text", { x: X(t.t), y: m.t + ih + 18, "text-anchor": "middle", text: t.label }));
  }
  svg.append(s("text", { class: "axis-title", x: m.l + iw / 2, y: H - 8, "text-anchor": "middle", text: axisName(res.xk) }));
  svg.append(s("text", { class: "axis-title", x: 14, y: m.t + ih / 2, "text-anchor": "middle", transform: `rotate(-90 14 ${m.t + ih / 2})`, text: axisName(res.yk) }));
  const clipId = "clip" + Math.random().toString(36).slice(2, 8);
  svg.append(s("clipPath", { id: clipId }, s("rect", { x: m.l, y: m.t, width: iw, height: ih })));

      const keys = ["rating", ...(hasTtb ? ["ttb"] : []), "year", "votes", "platforms"];
      let explorer;
      const matrix = matrixCard(G, keys, state, (a, b) => { explorer.set(a, b); explorer.scrollIntoView({ behavior: "smooth", block: "center" }); });
      explorer = explorerCard(G, state, keep);
      slot.replaceChildren(h("div", { class: "charts rel-charts" }, matrix, explorer));
      matrix.redraw(); explorer.redraw();
    } catch (e) { slot.replaceChildren(h("div", { class: "error" }, h("b", { text: "Couldn't load the relationship analysis. " }), h("code", { text: e.message }))); }
  };
  if ("IntersectionObserver" in window) {              // the table is a few MB: fetch it once this section is near the screen
    const io = new IntersectionObserver(entries => { if (entries.some(e => e.isIntersecting)) { io.disconnect(); load(); } }, { rootMargin: "500px" });
    io.observe(slot);
  } else load();
  return section;
}

async function statsPage(params) {
  document.title = "Stats · VideoGameData Explorer";
  const st = await api("api/stats");
  const t = st.totals;
  const pctOf = (a, b) => b ? ` (${Math.round(100 * a / b)}%)` : "";
  const tile = (v, k) => h("div", { class: "tile" }, h("div", { class: "v", text: v }), h("div", { class: "k", text: k }));
  const cards = [
    chartCard("Games released per year", "Release year of every game with a date, 1970 onward", st.per_year, { axis: "Year", unit: "games" }),
    chartCard("Rating distribution", "Average user + critic score, games with at least 5 ratings", st.ratings.map(r => ({ ...r, label: r.label })),
      { axis: "Score range", unit: "games", labelGap: 34, labelOf: r => `${r.label}–${r.label + 9}` }),
    chartCard("Top genres", "Games per genre (a game can have several)", st.top_genres, { horizontal: true, axis: "Genre", unit: "games" }),
    chartCard("Top platforms", "Games per platform (a game can be on several)", st.top_platforms, { horizontal: true, axis: "Platform", unit: "games" }),
    ...(st.ttb_buckets && st.ttb_buckets.length ? [
      chartCard("How long games take to beat", "Normal playthrough, games with at least 3 player reports", st.ttb_buckets,
        { axis: "Time to beat", unit: "games", labelGap: 64 }),
      chartCard("Median time to beat, by genre", "Hours for a normal playthrough; genres with 30+ timed games (a game can have several genres)",
        st.ttb_by_genre, { horizontal: true, axis: "Genre", unit: "median hours" }),
      chartCard("Median time to beat, by release year", "Hours for a normal playthrough; years with 20+ timed games",
        st.ttb_by_year, { axis: "Year", unit: "median hours" }),
    ] : []),
  ];
  app.replaceChildren(
    h("h1", { text: "Stats" }),
    scopeNote(),
    h("div", { class: "tiles" },
      tile(fmt(t.games), scoped() ? "games with an ESRB rating" : "games in the dump"),
      tile(fmt(t.rated), "with a rating" + pctOf(t.rated, t.games)),
      tile(fmt(t.covered), "with cover art" + pctOf(t.covered, t.games)),
      t.timed ? tile(fmt(t.timed), "with time to beat" + pctOf(t.timed, t.games)) : null,
      tile(t.first_year != null ? `${t.first_year}–${t.last_year}` : "–", "release years covered")),
    h("div", { class: "charts" }, cards),
    relationshipsSection(params || new URLSearchParams()));
  cards.forEach(c => c.redraw());
}
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => document.querySelectorAll(".chart-card").forEach(c => c.redraw && c.redraw()), 120);
});

(async () => {
  try { facets = await api("api/facets"); } catch (e) { /* the page itself will show the error */ }
  syncWildUi();
  route();
})();
